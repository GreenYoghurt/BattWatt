name: Python Tests

on:
  pull_request:
    branches: [ main, dev ]
    # ready_for_review: draft PRs opened by the upload failure agent use
    # GITHUB_TOKEN, which doesn't trigger CI; marking them ready does.
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Pytest
      run: |
        python -m pytest

  # Forward-compatibility check on the next Python. A separate job (not a
  # matrix) so the existing `test` check keeps its name for branch protection.
  test-python-3-15:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.15"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest
      run: |
        python -m pytest
